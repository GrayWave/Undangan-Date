
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ajakan Date ❤️</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background: linear-gradient(135deg,#ff9a9e,#fad0c4);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .card{
      background:white;
      width:90%;
      max-width:420px;
      padding:30px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,.2);
      transition:.4s;
    }

    h1{
      font-size:28px;
      margin-bottom:10px;
      color:#ff4d6d;
    }

    p{
      color:#666;
      margin-bottom:25px;
    }

    .buttons{
      display:flex;
      gap:15px;
      justify-content:center;
      align-items:center;
    }

    button{
      border:none;
      border-radius:999px;
      padding:14px 28px;
      font-size:18px;
      cursor:pointer;
      transition:.25s ease;
    }

    #yesBtn{
      background:#ff4d6d;
      color:white;
      transform:scale(1);
    }

    #skipBtn{
      background:#ddd;
      color:#333;
      transform:scale(1);
    }

    .hidden{
      display:none;
    }

    form{
      display:flex;
      flex-direction:column;
      gap:15px;
      margin-top:20px;
      text-align:left;
    }

    input{
      padding:12px;
      border-radius:10px;
      border:1px solid #ccc;
      font-size:16px;
    }

    label{
      font-weight:bold;
      color:#444;
    }

    .submit{
      background:#ff4d6d;
      color:white;
      font-size:18px;
      padding:14px;
      border-radius:12px;
    }

    .success{
      color:#ff4d6d;
      font-size:22px;
      margin-top:15px;
    }

    .heart{
      font-size:48px;
      animation:beat 1s infinite;
    }

    @keyframes beat{
      0%{transform:scale(1);}
      50%{transform:scale(1.2);}
      100%{transform:scale(1);}
    }
  </style>
</head>
<body>

<div class="card" id="step1">
  <div class="heart">❤️</div>
  <h1>Apakah kamu mau date hari ini?</h1>
  <p>Aku sudah menyiapkan sesuatu yang spesial untuk kita berdua.</p>

  <div class="buttons">
    <button id="yesBtn">Mau</button>
    <button id="skipBtn">Skip</button>
  </div>
</div>

<div class="card hidden" id="step2">
  <h1>Yay! 🥹</h1>
  <p>Pilih tanggal dan lokasi date kita ya.</p>

  <form id="dateForm">
    <div>
      <label>Tanggal Date</label>
      <input type="date" id="date" required />
    </div>

    <div>
      <label>Lokasi Date</label>
      <input type="text" id="location" placeholder="Misalnya: Cafe favorit kita" required />
    </div>

    <button class="submit" type="submit">Konfirmasi Date ❤️</button>
  </form>
</div>

<div class="card hidden" id="step3">
  <div class="heart">💕</div>
  <h1>Yeay, jadi date!</h1>
  <p id="result"></p>
  <div class="success">Aku nggak sabar ketemu kamu ❤️</div>
</div>

<script>
  const yesBtn = document.getElementById('yesBtn');
  const skipBtn = document.getElementById('skipBtn');

  // Efek tombol skip
  let yesScale = 1;
  let skipScale = 1;

  function enlargeYes(){
    yesScale = Math.min(2.2, yesScale + 0.15);
    skipScale = Math.max(0.45, skipScale - 0.08);

    yesBtn.style.transform = `scale(${yesScale})`;
    skipBtn.style.transform = `scale(${skipScale})`;
  }

  skipBtn.addEventListener('mouseenter', enlargeYes);
  skipBtn.addEventListener('touchstart', enlargeYes);

  yesBtn.addEventListener('click', () => {
    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.remove('hidden');
  });

  document.getElementById('dateForm').addEventListener('submit', function(e){
    e.preventDefault();

    const date = document.getElementById('date').value;
    const location = document.getElementById('location').value;

    document.getElementById('step2').classList.add('hidden');
    document.getElementById('step3').classList.remove('hidden');

    document.getElementById('result').innerHTML =
      `Kita akan date pada <b>${date}</b><br>di <b>${location}</b>.`;
  });
</script>

</body>
</html>
